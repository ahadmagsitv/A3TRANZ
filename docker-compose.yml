services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: a3
      POSTGRES_PASSWORD: a3
      POSTGRES_DB: a3tranz
    ports: ['5433:5432']
    volumes: ['a3pg:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U a3 -d a3tranz']
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  a3pg:
